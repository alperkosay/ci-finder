<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live demo · theFinder</title>
    <meta name="description" content="theFinder, the file manager, with its real engine running in the browser." />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./main.css" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --text: #1d1d1f;
        --text-2: #6e6e73;
        --line: #d2d2d7;
        --seg: #e8e8ed;
        --seg-on: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --text: #f5f5f7;
          --text-2: #a1a1a6;
          --line: #424245;
          --seg: #1d1d1f;
          --seg-on: #424245;
        }
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 16px;
        height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        flex: none;
      }
      .bar-back {
        color: var(--text);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      .bar-note {
        margin: 0;
        color: var(--text-2);
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar-seg {
        display: flex;
        padding: 2px;
        border-radius: 8px;
        background: var(--seg);
      }
      .bar-seg button {
        border: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 500;
        padding: 3px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .bar-seg button[aria-pressed="true"] {
        background: var(--seg-on);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
      }
      .stage {
        flex: 1;
        min-height: 0;
        padding: 12px;
      }
      .is-embed .stage {
        padding: 0;
      }
      .fallback {
        max-width: 560px;
        margin: 15vh auto 0;
        padding: 0 24px;
        line-height: 1.5;
      }
      .fallback h1 {
        font-size: 32px;
        letter-spacing: -0.02em;
      }
      .fallback p {
        color: var(--text-2);
      }
      .fallback a {
        color: #0066cc;
      }
      @media (max-width: 600px) {
        .bar-note {
          display: none;
        }
        .bar {
          justify-content: space-between;
        }
        .stage {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
